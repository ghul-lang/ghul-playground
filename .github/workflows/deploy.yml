name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  HOST: playground.ghul.dev
  # Where the playground is served, which the checks after the deploy ask.
  # HOST is the machine the deploy reaches over ssh, which keeps its name.
  SITE: https://ghul.dev/playground/
  DEPLOY_USER: deploy

# One deploy at a time. A push that lands while one is running waits its turn
# rather than cancelling it, so the box is never left half-way between two
# versions by a cancelled run.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The multithreaded wasm runtime pack, which the browser runtime needs so
      # that a program can block reading a line. It ships with this workload
      # rather than with the SDK, and without it the build succeeds and the
      # runtime aborts at startup with
      # mono_wasm_start_deputy_thread_async() failed.
      - name: Install the wasm workload
        run: dotnet workload install wasm-tools

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Monaco is staged by `npm install`, and the publish fails without it.
      - name: Install node dependencies and stage Monaco
        run: npm install

      # The web app references the ghūl runner, so publishing it builds that
      # too, and the ghūl build needs the compiler this manifest pins.
      - run: dotnet tool restore

      - name: Publish the web app
        run: |
          dotnet publish web -c Release -o /tmp/playground-publish

          # The page ghul.dev serves at /repl/: repl.html with a base naming
          # the playground's directory. Written from the published page so it
          # carries the same fingerprinted names.
          node scripts/repl-entry.js /tmp/playground-publish/wwwroot

      # The deploy key is the only secret here. The host and its key are
      # public facts, so they are committed rather than held as secrets.
      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.PLAYGROUND_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 644 deploy/known_hosts ~/.ssh/known_hosts

      # The runtime version lives in both the front end and the services, so
      # they are deployed in the same run to keep the browser-loaded runtime
      # and the one the services compile against in step. The services go
      # first: they already have to serve pages opened before any deploy, so
      # new services under the old front end is a state that always works,
      # where a new front end on old services can ask for what they lack. And
      # a service build that fails then stops the run with nothing live
      # changed.
      #
      # --ff-only so a box that has drifted from main fails loudly instead of
      # being silently reconciled. The images are built before anything is
      # swapped, so the running containers are not torn down until the new
      # images exist. A failed build is tried once more after a minute: a
      # package just published can be missing from the box's view of the
      # NuGet index for a while, and the failed step is not cached, so the
      # second try restores again.
      - name: Build the services
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$HOST" \
            'cd /opt/ghul-playground \
             && git pull --ff-only \
             && { docker compose build || { echo "build failed; trying once more in a minute"; sleep 60; docker compose build; }; }'

      # --remove-orphans so a service taken out of compose.yaml is stopped and
      # removed here, rather than left running with nothing managing it. Its
      # volumes are left alone: removing one is a decision, not a deploy step.
      - name: Swap the services
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$HOST" \
            'cd /opt/ghul-playground && docker compose up -d --remove-orphans'

      # The new compile container starts with an empty result cache. The job
      # that refills it compiles on the host, not here, and takes several
      # minutes, so it is started detached and the deploy does not wait for it.
      - name: Refill the compile cache
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$HOST" \
            'PRECOMPILE_TARGETS=dotnet,wasm setsid nohup /opt/ghul-playground/deploy/precompile.sh > ~/precompile.log 2>&1 < /dev/null &'

      # The runtime is published under fingerprinted names, and a page loads it
      # only when it first compiles something, by the names of the publish the
      # page came from. A page open across a deploy would find those files gone,
      # so --delete leaves _framework alone, and the next step prunes it to the
      # files of this publish and the one before.
      - name: Deploy the front end
        run: |
          rsync -az --delete --filter='P _framework/**' \
            -e "ssh -i ~/.ssh/deploy_key" \
            /tmp/playground-publish/wwwroot/ \
            "$DEPLOY_USER@$HOST:/var/www/playground/"

      # The list of the previous publish's runtime files is kept in the deploy
      # user's home, outside what nginx serves. With no list yet there is
      # nothing known to be safe to delete, so the first run only records one.
      - name: Prune runtime files older than the previous publish
        run: |
          (cd /tmp/playground-publish/wwwroot/_framework && find . -type f -printf '%P\n' | sort) \
            > /tmp/framework-current.txt

          scp -i ~/.ssh/deploy_key /tmp/framework-current.txt "$DEPLOY_USER@$HOST:framework-current.txt"

          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$HOST" bash -s <<'SCRIPT'
          set -eu
          current=~/framework-current.txt
          previous=~/framework-previous.txt

          if [ -f "$previous" ]; then
            keep=$(mktemp)
            sort -u "$current" "$previous" > "$keep"

            cd /var/www/playground/_framework
            find . -type f -printf '%P\n' | sort | comm -23 - "$keep" | while IFS= read -r stale; do
              rm -f -- "$stale"
            done

            rm -f "$keep"
          fi

          mv "$current" "$previous"
          SCRIPT

      # The user agent marks these as the deploy smoke test, so nginx can route
      # them to ci-access.log rather than the main access log.
      - name: Check the box came back
        run: |
          code=$(curl -s -A ghul-playground-deploy-check -o /dev/null -w '%{http_code}' "$SITE")
          echo "front end -> $code"
          test "$code" = 200

          # The old host redirects its pages here now, and keeps serving the
          # services and files that pages open from before the move still use.
          old=$(curl -s -A ghul-playground-deploy-check -o /dev/null -w '%{http_code} %{redirect_url}' "https://$HOST/")
          echo "old host -> $old"
          test "$old" = "301 $SITE"

          # Two Cross-Origin-Resource-Policy headers read as none, which blocks
          # the counter on the documentation site. The nginx configuration is
          # installed by apply-nginx.sh rather than by this workflow, so this
          # warns rather than failing a deploy it could not have fixed.
          corp=$(curl -s -A ghul-playground-deploy-check -D - -o /dev/null "https://ghul.dev/stats/count.js" \
              | grep -ci '^cross-origin-resource-policy:' || true)
          echo "count.js Cross-Origin-Resource-Policy headers -> $corp"
          test "$corp" = 1 \
              || echo "::warning::count.js carries $corp Cross-Origin-Resource-Policy headers; run deploy/apply-nginx.sh on the host"

          # A successful compile is what proves the toolchain the box just
          # built actually runs, not merely that a container answers. Poll it:
          # the services take a moment to come up after the swap.
          source='{"source":"use IO.Std.write_line;\n\nentry() is\n    write_line(\"ok\");\nsi\n"}'

          for _ in $(seq 1 30); do
            if curl -sf -A ghul-playground-deploy-check -X POST "${SITE}compile" \
                -H 'content-type: application/json' \
                -d "$source" \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                    const r=JSON.parse(s);
                    process.exit(r.ok && r.assembly ? 0 : 1);
                  })'; then
              echo "compile service: ok"
              exit 0
            fi
            sleep 2
          done

          echo "compile service never produced an assembly" >&2
          exit 1

      # The deploy updates the checkout on the host but has no root to install
      # nginx files with, so a change to deploy/nginx/ reaches production only
      # when somebody installs it. Until then this fails the run, naming the
      # files and the commands that install them. It comes after the services
      # are swapped and checked, so a deploy that does not touch nginx still
      # lands.
      - name: Check the services run the repository's configuration
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$HOST" /opt/ghul-playground/deploy/check-running-config.sh

      - name: Check the host runs the repository's nginx configuration
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$HOST" /opt/ghul-playground/deploy/check-nginx.sh
