# Per-address limits for the playground back ends.
#
# Copy to /etc/nginx/conf.d/. It has to live there rather than in the site file
# next to it, because limit_req_zone and limit_conn_zone are only valid in the
# http context, and a file in sites-enabled is included inside a server block.
#
# These bound one address, which is all nginx can see. They are the cheap half
# of the answer: the services impose the limits that hold whatever the traffic
# is spread across, a cap on simultaneous compiles and a cap on sessions.

# A compile costs about a CPU-second, so a sustained one every two seconds from
# a single address is already generous for someone editing and re-running. The
# burst absorbs the impatient clicking that a real reader does.
limit_req_zone $binary_remote_addr zone=playground_compile:1m rate=30r/m;

# Cells of an interactive session, which compile one at a time as a reader
# types them. Kept apart from whole programs, so that a session cannot use up
# an address's program compiles or the other way round.
limit_req_zone $binary_remote_addr zone=playground_cells:1m rate=12r/m;

# A backstop only. The analyse service caps each address itself, and when an
# address is at its cap it gives the new connection the slot of that
# address's longest-quiet session rather than refusing it - which it can only
# do if the connection reaches it. So this sits well above the service's cap
# and bounds only a client opening connections without end.
limit_conn_zone $binary_remote_addr zone=playground_analyse:1m;

# 429 rather than nginx's default 503: this is the client being asked to slow
# down, not the service failing.
limit_req_status 429;
limit_conn_status 429;

# Whose pageviews not to record. $count_excluded is 1 for an address whose
# visits should not reach the analytics.
#
# The ranges themselves are not in this repository: an exclusion list describes
# whoever is running the site rather than the site. They live in
# /etc/nginx/analytics-exclude.conf on the host, written by hand like the
# certificate and .env are; analytics-exclude.conf.example alongside this file
# is the template and carries the guidance on choosing one.
#
# Two details in that one include line, both of which bite if changed:
#
#   - The filename is literal, and must stay so. The `include` inside a `geo`
#     block is the geo module's own directive rather than the core one, and it
#     opens exactly what it is given - no wildcard expansion. A glob here fails
#     with "open() .../analytics-exclude*.conf failed (2: No such file or
#     directory)" even when a file matching the pattern does exist, which reads
#     as a missing file rather than as an unsupported pattern. Since there is no
#     tolerant form, host-setup.sh installs a comments-only default so the file
#     always exists and nginx always starts.
#   - The path. It is /etc/nginx and NOT /etc/nginx/conf.d, because nginx.conf
#     already pulls conf.d/*.conf into the http context - a file of bare
#     "1.2.3.0/24 1;" lines would be read there too, where it is a syntax error.
#
# This is the half that works regardless of the reader's browser. The other half
# is GoatCounter's own #toggle-goatcounter flag, which is per-browser and per
# origin, and covers the addresses this one cannot see. Neither is sufficient
# alone.
geo $count_excluded {
    default 0;
    include /etc/nginx/analytics-exclude.conf;
}

# Connection: upgrade only when the client actually asked for it. The /analyse
# block can hard-code "upgrade" because every request there is a WebSocket, but
# GoatCounter's dashboard opens one over a prefix that otherwise serves ordinary
# pages, and sending the header on a plain GET is wrong. This has to live here
# rather than beside that location, because map is only valid in http context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The deploy workflow's smoke test (deploy.yml) marks itself with this user
# agent, and the site file routes the marked requests to ci-access.log instead
# of the main one. The marker is a user agent rather than a path or an IP
# because the check deliberately exercises the public /compile - that is what
# proves the freshly built toolchain runs - and the runner addresses change
# every deploy. It has to live here for the same http-context reason as above.
map $http_user_agent $deploy_check {
    default                          0;
    "~^ghul-playground-deploy-check" 1;
}

# Its complement, so each access_log can name the traffic it wants directly.
map $deploy_check $not_deploy_check {
    1       0;
    default 1;
}

# The client address cut to its network - an IPv4 /24, an IPv6 /48 - for the
# logs kept past a fortnight, which are for trends rather than for finding one
# client. A shortened IPv6 address with fewer than three groups before its `::`
# is written as bare `::`, which loses nothing a trend needs. Each group has to
# be non-empty, or `2001:db8::1` would match with an empty third group and be
# written as the malformed `2001:db8:::`. test/network-addr.mjs checks the
# shapes.
map $remote_addr $network_addr {
    "~^(\d+\.\d+\.\d+)\.\d+$"           $1.0;
    "~^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+):"      $1::;
    "~:"                                     ::;
    default                                  -;
}

log_format kept '$network_addr - - [$time_local] "$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent"';
