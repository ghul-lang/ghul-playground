# The documentation site, served from this host alongside the playground.
#
# Copy to /etc/nginx/sites-available/, symlink into sites-enabled/. Certbot
# fills in the certificate paths when it first issues; the certificate has to
# cover both names.
#
# It is here rather than on GitHub Pages for one reason: the embedded playground
# runs the .NET runtime on a worker thread, which needs a SharedArrayBuffer,
# which needs the page to be cross-origin isolated - and isolation is granted by
# the two headers below. Pages serves no custom headers at all, so an embedded
# playground there can never be isolated, whatever the playground's own origin
# sends. A cross-origin frame is isolated only when the document framing it is.

server {
    listen 80;
    listen [::]:80;
    server_name ghul.dev www.ghul.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www is a CNAME to the apex, so it reaches this host and has to be answered,
# but it does not serve the site: one canonical origin rather than two. That is
# worth more here than it usually is, because cross-origin isolation is a
# property of an origin - two of them would be two sets of headers to keep
# right, for a name nothing links to.
#
# It is on the certificate rather than dropped because the certificate covers
# both names and renewal revalidates both. A CNAME resolves wherever the apex
# does, so www cannot fall out of step with it and fail a renewal that would
# otherwise take the apex's certificate down too.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ghul.dev;

    ssl_certificate /etc/letsencrypt/live/ghul.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghul.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ghul.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ghul.dev;

    ssl_certificate /etc/letsencrypt/live/ghul.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghul.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ghul-dev-access.log combined;

    # With the address cut to its network, kept for 180 days by
    # deploy/logrotate/ghul-playground-kept.
    access_log /var/log/nginx/kept/ghul-dev-access.log kept;

    root /var/www/ghul-dev;
    index index.html;

    # Cross-origin isolation, which is what the embedded playground needs and
    # the whole reason this site is served from here.
    #
    # require-corp rather than credentialless because Safari implements only the
    # former: under credentialless a Safari reader gets a page that is simply not
    # isolated, and the embedded playground fails to start with nothing on the
    # page to say why. The price is that every cross-origin subresource has to
    # opt in, which is why the font is served from here rather than from a CDN
    # and why the playground host sends Cross-Origin-Resource-Policy.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The publish writes a .br beside every .gz, and brotli is about a quarter
    # smaller than gzip on the runtime's assemblies, so serving it is worth a
    # directive. Without it a client that offers only brotli is served the file
    # with no compression at all rather than the gzip.
    #
    # brotli_static comes from libnginx-mod-http-brotli-static, which is not
    # installed by host-setup.sh; see deploy/README.md. With the module absent
    # nginx -t rejects the directive as unknown, so apply-nginx.sh restores the
    # previous configuration and the site is unaffected, but check-nginx.sh
    # reports drift until the package is in.
    brotli_static on;
    gzip_static on;

    # VitePress fingerprints everything under assets/, so the name changes with
    # the content.
    location ^~ /assets/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
    }

    # Every document keeps a stable name across deploys, so it has to be
    # revalidated rather than cached: otherwise a deploy leaves browsers on the
    # previous page shell, which loads asset names that are no longer there.
    #
    # The headers above are repeated in each location that adds one of its own,
    # because an add_header at this level replaces the inherited set rather than
    # extending it. Dropping the isolation headers from a document is not a
    # cosmetic mistake - it un-isolates that page and only that page, so the
    # playground works everywhere except the one example somebody linked to.
    location ~* \.html$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }

    # cleanUrls is on, so the site links to /functional-programming rather than
    # to the .html file the build actually wrote. $uri.html is what resolves
    # that, and it has to come before $uri/ or a directory of the same name
    # would win.
    #
    # =404 rather than naming the page here: a try_files fallback to a URI
    # serves that page with a 200, so a missing page would tell a crawler it
    # had found one. error_page below renders the same file with the status it
    # ought to have.
    location / {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # The Rosetta Code section is one page rather than a page per task: the
    # explorer reads the corpus from GitHub when a reader opens it, so a task
    # exists here the moment it is written there and nothing has to be rebuilt.
    # /rosetta/<slug> is still the address of a task, and links to those are out
    # in the world, so the section's page answers every one of them and reads
    # the slug out of the path itself. A slug naming no task shows a plain
    # not-found state with the explorer beneath it.
    #
    # The =404 above stays the rule everywhere else, and it still applies to the
    # files this block names: the try_files here serves a real asset under
    # /rosetta/ ahead of the page, so a name that is neither is the page rather
    # than a silent 200 on a missing document. That is the one place this
    # section differs from the rest of the site, and it differs because the
    # slugs are data rather than pages.
    location ^~ /rosetta/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ /rosetta/index.html;
    }


    # The playground, served from its own directory: /var/www/playground,
    # deployed there by ghul-playground, rather than from this site's root, which
    # the documentation deploy replaces wholesale. `root /var/www` maps
    # /playground/x onto /var/www/playground/x and, unlike alias, is inherited
    # by the locations nested in it. ^~ keeps this site's own \.html match from
    # claiming the playground's pages.
    #
    # Every location that adds a header repeats the whole set, since adding one
    # stops the enclosing ones being inherited. The isolation headers are the
    # ones this site already sends; frame-ancestors lets this site's own pages
    # frame the embedded playground and nothing else.
    location = /playground {
        return 301 /playground/$is_args$args;
    }

    location ^~ /playground/ {
        root /var/www;
        index index.html;

        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        # Stable names across deploys, so revalidated rather than cached: see
        # the playground host's own configuration for why.
        add_header Cache-Control "no-cache" always;

        try_files $uri $uri/ =404;

        # Fingerprinted by the .NET publish, so cached indefinitely.
        location ^~ /playground/_framework/ {
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
            expires 1y;
            add_header Cache-Control "public, immutable";

            # The runtime's worker module; nginx's types have no .mjs, and
            # nosniff would then refuse to run it. Adds no header, so it
            # inherits the set above.
            location ~ \.mjs$ {
                default_type text/javascript;
            }
        }

        # A program opened by path is the entry page, which reads the path.
        location ^~ /playground/rosetta-code/ {
            rewrite ^ /playground/index.html last;
        }

        location ^~ /playground/ghul-examples/ {
            rewrite ^ /playground/index.html last;
        }

        # The services, beside the page as on the playground host, under the
        # same zones - so an address shares one set of limits across both
        # hosts rather than getting two.
        location = /playground/compile {
            limit_req zone=playground_compile burst=15 nodelay;

            proxy_pass http://127.0.0.1:5090/compile;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            client_max_body_size 64k;
        }

        location = /playground/compile/cell {
            limit_req zone=playground_cells burst=6 nodelay;

            proxy_pass http://127.0.0.1:5090/compile/cell;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            client_max_body_size 2m;
        }

        location = /playground/analyse {
            limit_conn playground_analyse 8;

            proxy_pass http://127.0.0.1:5091/analyse;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /playground/health {
            proxy_pass http://127.0.0.1:5091/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # The REPL: its entry page is repl.html with a base naming ../playground/,
    # written at publish, so everything it loads is the playground's and is
    # shared with it.
    location = /repl {
        return 301 /repl/$is_args$args;
    }

    location = /repl/ {
        root /var/www/playground;

        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Cache-Control "no-cache" always;

        try_files /repl-entry.html =404;
    }

    # Analytics. GoatCounter picks its site by the Host header, and its site is
    # this one, ghul.dev. $count_excluded and $connection_upgrade come from
    # conf.d/playground-limits.conf.
    location = /stats/count {
        if ($count_excluded) {
            return 202;
        }

        proxy_pass http://127.0.0.1:5092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /stats/ {
        proxy_pass http://127.0.0.1:5092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    error_page 404 /404.html;
}
