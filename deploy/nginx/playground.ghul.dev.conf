# Reverse proxy for a deployed playground.
#
# Copy to /etc/nginx/sites-available/, symlink into sites-enabled/, and edit the
# server name. Install playground-limits.conf into conf.d/ at the same time: the
# rate and connection zones this file uses are defined there. Certbot fills in
# the certificate paths when it first issues.

# Port 80 exists for two things: sending real traffic to HTTPS, and letting
# Let's Encrypt validate. The challenge path is served here rather than being
# redirected, so renewal does not depend on anything in the HTTPS server below.
server {
    listen 80;
    listen [::]:80;
    server_name playground.ghul.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name playground.ghul.dev;

    ssl_certificate /etc/letsencrypt/live/playground.ghul.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playground.ghul.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The main log carries readers only. The deploy workflow's smoke test
    # (deploy.yml) marks itself with a distinctive user agent, and $deploy_check
    # in conf.d/playground-limits.conf routes those requests to their own file -
    # still recorded, since a deploy that went wrong is worth being able to see,
    # but out of the log every "did anyone use this" question starts from.
    access_log /var/log/nginx/access.log combined if=$not_deploy_check;
    access_log /var/log/nginx/ci-access.log combined if=$deploy_check;

    # The same readers again, with the address cut to its network, kept for
    # 180 days by deploy/logrotate/ghul-playground-kept.
    access_log /var/log/nginx/kept/access.log kept if=$not_deploy_check;

    # There is no address allow list, and there cannot be: the point of the
    # embed is to be reached from a documentation site whose readers are
    # anywhere. What bounds the load instead is the per-address limits below,
    # and, in the services, a cap on simultaneous compiles and on sessions.
    #
    # Note what is deliberately NOT restricted: /health answers unauthenticated
    # and to any origin, because an embedding page has to be able to ask whether
    # a back end exists before it knows it is welcome to one.

    # Kept while the services below are: a page still cached from before the
    # move, framed by or running on ghul.dev under require-corp, can only load
    # count.js and reach the counter from here if this says it may. The /stats/
    # locations hide GoatCounter's own copy of the header so there is one.
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The playground has moved to ghul.dev: its pages are served at
    # https://ghul.dev/playground/ and the REPL at https://ghul.dev/repl/. Every
    # page here redirects permanently to the same path there, so a link to a
    # program keeps working. The REPL page moved to a name of its own.
    #
    # Everything else stays as it was for some weeks after the move: the
    # services below are proxied, and the playground's other files are served
    # from its directory, which the deploy still publishes to. A page already
    # open from this host posts to the services, opens WebSockets to them, and
    # loads files it needs later - the .NET runtime on its first run - and none
    # of those follows a redirect to another origin.
    location = /repl.html {
        return 301 https://ghul.dev/repl/$is_args$args;
    }

    location = / {
        return 301 https://ghul.dev/playground/$is_args$args;
    }

    location ^~ /rosetta-code/ {
        return 301 https://ghul.dev/playground$request_uri;
    }

    # The pages a reader opens. cell-host.html is not one: an open REPL page
    # fetches it, and a fetch across origins cannot follow the redirect.
    location ~ ^/(index|embed)\.html$ {
        return 301 https://ghul.dev/playground$request_uri;
    }

    location = /compile {
        # Zones defined in conf.d/playground-limits.conf, which must be
        # installed alongside this file.
        limit_req zone=playground_compile burst=15 nodelay;

        proxy_pass http://127.0.0.1:5090/compile;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        # Comfortably above the 32 KB of source the service accepts, so that a
        # program merely over the limit gets the service's explanation rather
        # than nginx's bare 413, while anything absurd is refused here.
        client_max_body_size 64k;
    }

    # The cells of an interactive session. The compile service answers 404 here
    # unless it has REPL_ENABLED=1, so this route alone switches nothing on.
    location = /compile/cell {
        limit_req zone=playground_cells burst=6 nodelay;

        proxy_pass http://127.0.0.1:5090/compile/cell;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        # A request carries every cell of the session: up to 50 of them and
        # 256 KB of source, escaped as JSON. Above that the service explains;
        # anything absurd is refused here.
        client_max_body_size 2m;
    }

    # An analyser session is a long-lived WebSocket that is idle whenever the
    # user is thinking, so the read timeout has to outlast that; the service
    # does its own idle reaping.
    location = /analyse {
        limit_conn playground_analyse 8;

        proxy_pass http://127.0.0.1:5091/analyse;
        # Set rather than appended to, so a client cannot supply it: the
        # service counts sessions per address by this and trusts nothing else.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5091/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # GoatCounter, under a path rather than a subdomain of its own: -base-path
    # in the container's arguments has to agree with this prefix, and neither
    # works without the other.
    #
    # The count endpoint is separated out so that an excluded address can be
    # answered here instead of being recorded. 202 with an empty body is what
    # GoatCounter itself returns when its own ignore list matches, so count.js
    # sees exactly what it expects and the reader notices nothing.
    #
    # Note this cannot be done by IP inside GoatCounter: its ignore list matches
    # a single literal address, with no CIDR support, and a consumer address
    # moves around its pool. nginx has ranges, so the exclusion lives here.
    location = /stats/count {
        if ($count_excluded) {
            return 202;
        }

        proxy_pass http://127.0.0.1:5092;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_http_version 1.1;
        proxy_set_header Host ghul.dev;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # count.js, for pages cached from before the move. GoatCounter sends its own
    # Cross-Origin-Resource-Policy, and the one this server adds would make two,
    # which browsers read as none, so its own is hidden here as on the counter.
    # Both report as ghul.dev, the site GoatCounter now keeps.
    location = /stats/count.js {
        proxy_pass http://127.0.0.1:5092;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_http_version 1.1;
        proxy_set_header Host ghul.dev;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The dashboard is ghul.dev's now; it logs in there.
    location ^~ /stats/ {
        return 301 https://ghul.dev$request_uri;
    }

    # The playground's files, with the headers they were always served with:
    # the runtime needs the page cross-origin isolated, and its worker module
    # typed.
    location / {
        root /var/www/playground;

        # As on ghul.dev: the .br files are already published, and a client that
        # offers only brotli is otherwise served no compression at all. The
        # module is a separate package, and nginx -t rejects the directive as
        # unknown without it; see deploy/README.md.
        brotli_static on;
        gzip_static on;

        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;

        try_files $uri =404;

        location ~ \.mjs$ {
            default_type text/javascript;
        }
    }
}
