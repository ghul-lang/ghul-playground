<!DOCTYPE html>
<html>

<head>
  <title>ghūl playground (embedded)</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <style>
    /* The same face and source ghul.dev uses, so an example looks identical
       whether it is being read or edited. The frame is a separate origin, so
       the site's own @font-face declaration does not reach it. */
    @font-face {
      font-family: 'Fira Code';
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
      src: url('https://cdn.jsdelivr.net/npm/firacode@6.2.0/distr/woff2/FiraCode-VF.woff2') format('woff2');
    }
  </style>
  <link rel="stylesheet" href="vs/editor/editor.main.css">
  <script src="vs/loader.js"></script>
  <script type='module' src="embed.js"></script>
  <!-- The counter, for the failures this page alone can see. Everything else an
       embedded editor does is counted by the documentation page around it, and
       so is the view, so the counter sends no pageview. It also ignores
       everything from inside a frame unless told otherwise, and this page is
       only ever framed. -->
  <script>
    window.goatcounter = { allow_frame: true, no_onload: true };
  </script>
  <script id="goatcounter" data-goatcounter="/stats/count"
          async src="/stats/count.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      /* Not `overflow: hidden`: that stops a wheel event chaining out to the
         embedding page, which would trap scrolling over the editor. The frame
         is sized to its content, so there is nothing here to scroll anyway. */
      overflow: clip;
      overscroll-behavior: auto;
    }

    /* The frame is sized by the parent from the height this page reports, so
       the editor fills whatever it is given. */
    #editor {
      width: 100%;
      height: 100%;
    }

    /* Which target the next run uses, offered only for a program known to run
       on wasm in a browser that can run it. Floats in the corner opposite the
       page's own controls. */
    .target {
      position: fixed;
      right: 0.6rem;
      bottom: 0.4rem;
      z-index: 10;
      display: inline-flex;
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 6px;
      overflow: hidden;
      font: 0.75rem system-ui, sans-serif;
    }

    .target[hidden] { display: none; }

    .target button {
      border: none;
      padding: 0.15rem 0.5rem;
      background: transparent;
      color: #8a8a8a;
      opacity: 0.75;
      cursor: pointer;
    }

    .target button[aria-pressed="true"] { opacity: 1; background: rgba(128, 128, 128, 0.2); }
  </style>
</head>

<body>
  <div id="editor"></div>
  <span id="target" class="target" role="group" aria-label="Run on" hidden>
    <button data-target="wasm" title="Run in the browser's WebAssembly engine">wasm</button>
    <button data-target="dotnet" title="Run on .NET">.NET</button>
  </span>
</body>

</html>
