# The three services, with the limits that actually contain the compiler.
#
# The build context is the repository root for compile and analyse, because they
# share the reference-set resolution in shared/. goatcounter shares nothing with
# either and builds from its own directory.
#
# Egress is the one control this file cannot express. Docker gives a container
# either a network or none, and every service needs ingress, so they get both.
# Block outbound traffic at the host firewall or put them on an internal network
# behind the reverse proxy.
#
# compile and analyse are stateless and can be thrown away at any point.
# goatcounter is not: its volume is the only thing on this host that cannot be
# rebuilt from this repository. See "analytics" in deploy/README.md.

x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Pinned, because the host firewall rule that denies these containers egress
# matches on this subnet. Left to Docker it is assigned at creation and can
# change when the network is recreated, silently orphaning the rule and
# restoring the egress it was there to remove.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.240.0/24

services:
  compile:
    <<: *hardening
    # To the host journal rather than a file inside the container, so what the
    # service logged - its outcome lines included - survives the recreation
    # every deploy does. Read with `journalctl CONTAINER_TAG=ghul-playground-compile`.
    logging:
      driver: journald
      options:
        tag: ghul-playground-compile
    cgroup_parent: playground-compile.slice
    build:
      context: .
      dockerfile: compile-service/Dockerfile
    image: ghul-playground-compile

    environment:
      # A short fixed list of shared access tokens, comma separated. Supplied
      # from the environment, never committed. Empty leaves the services open,
      # which is the current posture; the load is bounded by the caps below and
      # the nginx per-address limits instead. Both services must agree.
      PLAYGROUND_TOKENS: "${PLAYGROUND_TOKENS:-}"
      # Which sites may drive the service from a browser. Unset means any, which
      # is what local development wants. Both services must agree here too.
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      # A compile is about a CPU-second and peaks near 200 MB, so this rather
      # than mem_limit is what keeps the container off its cap. Past the queue
      # the service answers 503 rather than accepting work it cannot do.
      #
      # The compiler is single threaded, so this is a count of cores in use as
      # much as it is a concurrency limit: raising it makes the service wider,
      # never any one compile faster, and it should not exceed the cpus below.
      MAX_CONCURRENT_COMPILES: "6"
      MAX_QUEUED_COMPILES: "12"
      COMPILE_TIMEOUT_MS: "10000"
      # The cells of an interactive session: off unless REPL_ENABLED is 1 in
      # the environment, in which case /compile/cell exists at all. Its cache
      # of built cell assemblies is the `cells` volume below.
      REPL_ENABLED: "${REPL_ENABLED:-}"
      MAX_CELLS: "50"
      MAX_CHAIN_BYTES: "262144"
      CELL_CACHE_DIR: "/cells"
      CELL_CACHE_BYTES: "67108864"

    # Bound to loopback: these sit behind a reverse proxy that terminates TLS,
    # rather than facing the internet themselves.
    ports:
      - "127.0.0.1:5090:5090"

    # The compiler writes its output next to the source it was given.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    volumes:
      - cells:/cells

    # A compile of a single file peaks under 200 MB measured; the cap is here so
    # a runaway allocation fails rather than taking the host down.
    # Six concurrent compiles peaking near 200 MB each is around 1.2 GB, so
    # this is roughly double what a full queue can reach. It bounds a runaway
    # rather than rationing what the host has to spare.
    mem_limit: 3g
    memswap_limit: 3g
    # One core per concurrent compile, since the compiler is single threaded.
    # Docker refuses a value above the host's CPU count, so this has to fit the
    # smallest machine deployed to.
    cpus: 6.0
    pids_limit: 256

  analyse:
    <<: *hardening
    # To the host journal, as compile's is.
    logging:
      driver: journald
      options:
        tag: ghul-playground-analyse
    cgroup_parent: playground-analyse.slice
    build:
      context: .
      dockerfile: analyse-service/Dockerfile
    image: ghul-playground-analyse

    ports:
      - "127.0.0.1:5091:5091"

    environment:
      PLAYGROUND_TOKENS: "${PLAYGROUND_TOKENS:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      # Measured against the trimmed reference set and a single file, an
      # analyser costs around 70 MB rather than the 260 MB a full project
      # needs. The worst case is MAX_SESSIONS + POOL_SIZE of them, since the
      # pool tops up alongside the sessions in use rather than instead of them.
      MAX_SESSIONS: "24"
      POOL_SIZE: "6"
      IDLE_TIMEOUT_MS: "300000"
      # Per client address; nginx allows twice this as a backstop. An address
      # at its cap takes the slot of its own session quiet longest, if that
      # one has been quiet for EVICT_QUIET_MS.
      MAX_SESSIONS_PER_ADDRESS: "4"
      EVICT_QUIET_MS: "20000"
      MAX_SESSION_MS: "3600000"
      # The analyser for an interactive session's input. Off unless
      # REPL_ENABLED is 1, and then it reads earlier cells, by key, from the
      # compile service's cache, which it cannot write.
      REPL_ENABLED: "${REPL_ENABLED:-}"
      MAX_CELLS: "50"
      CELL_CACHE_DIR: "/cells"

    # Each session gets its own workspace directory here, and the analyser
    # writes the document to it.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    volumes:
      - cells:/cells:ro

    # Well above what the sessions above can hold - a measured analyser is
    # around 90 MB, so a full house is under 3 GB. The limit is here to make a
    # runaway allocation fail rather than to ration memory the host has spare,
    # and it is set high enough that the per-analyser figure drifting upward
    # between compiler releases cannot quietly turn it into a real ceiling.
    mem_limit: 6g
    memswap_limit: 6g
    # Fewer than MAX_SESSIONS on purpose. An analyser is single threaded and a
    # session spends nearly all of its life idle between keystrokes, so this is
    # the number of requests that can be served at once rather than the number
    # of sessions that can be open. Raise it if hover latency under load is the
    # complaint; it cannot usefully exceed the sessions actually mid-request.
    cpus: 4.0
    pids_limit: 512

  goatcounter:
    <<: *hardening
    cgroup_parent: playground-goatcounter.slice
    build:
      context: goatcounter
      dockerfile: Dockerfile
    image: ghul-playground-goatcounter

    ports:
      - "127.0.0.1:5092:5092"

    # The named volume, not a tmpfs: this is the one service whose data has to
    # survive the container. read_only above still holds for the rest of the
    # filesystem - the volume is the only writable path, which is what we want.
    volumes:
      - goatcounter-data:/home/goatcounter/goatcounter-data

    # CSV exports are written to TMPDIR. Small, and nothing else needs scratch
    # space, so this is well clear of what it will ever hold.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

    # An order of magnitude below the other two. It serves a dashboard and
    # appends rows; the work is neither CPU- nor memory-shaped, and on SQLite
    # at this site's volume it sits near idle. The cap is here so that a runaway
    # cannot take the compile service down with it.
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128

  # A copy of the analytics database for Grafana to read, and nothing else.
  #
  # Grafana cannot read the live one: it is in WAL mode, so a reader has to be
  # able to create the -shm file beside it, and a read-only mount refuses while
  # a read-write mount would put a second writer on the only irreplaceable thing
  # on this host. So this takes a copy. It is also where visits that are not
  # visitors are removed, which keeps the rules out of the dashboards and out of
  # this repository - see deploy/snapshot/snapshot.sh.
  snapshot:
    <<: *hardening
    cgroup_parent: playground-snapshot.slice
    build:
      context: deploy/snapshot
      dockerfile: Dockerfile
    image: ghul-playground-snapshot

    volumes:
      - goatcounter-data:/data
      - goatcounter-snapshot:/snapshot

    environment:
      # The name goatcounter gives it, which is not the name of the service.
      SNAPSHOT_SOURCE: /data/db.sqlite3
      SNAPSHOT_TARGET: /snapshot/analytics.sqlite3
      SNAPSHOT_INTERVAL: "300"
      # Which visits are the site's own rather than a visitor's. Set on the
      # host, never here: it describes the people running the site rather than
      # the service. deploy/README.md has the format - one line, rules
      # separated by `;`, because a compose environment file cannot carry a
      # value that spans lines.
      SNAPSHOT_EXCLUDE: "${SNAPSHOT_EXCLUDE:-}"

    # It copies a file of a few hundred kilobytes and runs a handful of
    # statements over it, twelve times an hour.
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64

  # The pages that say what visitors did and what the host is doing, for the
  # one person who reads them. Published by nginx at ghul.dev/stats/insights/,
  # behind INSIGHTS_PASSWORD; also on loopback, for an ssh tunnel. It reads the
  # snapshot, read-only, and asks Prometheus over this network; it writes
  # nothing anywhere. See "insights" in deploy/README.md.
  insights:
    <<: *hardening
    cgroup_parent: playground-insights.slice
    build:
      context: insights
      dockerfile: Dockerfile
    image: ghul-playground-insights

    ports:
      - "127.0.0.1:5094:5094"

    volumes:
      # The copy, not the database: the same one Grafana reads.
      - goatcounter-snapshot:/snapshot:ro

    environment:
      SNAPSHOT: /snapshot/analytics.sqlite3
      PROMETHEUS_URL: http://prometheus:9090
      # Set on the host in .env, never here. Left empty rather than required,
      # so that a deploy made before it is set still succeeds: the service
      # then refuses every request, which fails closed.
      INSIGHTS_PASSWORD: "${INSIGHTS_PASSWORD:-}"

    # A page reads a period's rows into memory - tens of thousands for a
    # quarter at this site's volume, a few megabytes - and nothing else.
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # Loopback only, reached over an ssh tunnel; nothing in nginx routes to it.
  grafana:
    <<: *hardening
    cgroup_parent: playground-grafana.slice
    build:
      context: deploy/grafana
      dockerfile: Dockerfile
    image: ghul-playground-grafana

    # Loopback, and nothing in front of it. The dashboards are reached by
    # forwarding this port over ssh rather than by publishing a route to them:
    #
    #     ssh -L 3000:127.0.0.1:5093 playground.ghul.dev
    #
    # then http://localhost:3000/. The host is key-only with root login
    # disabled, so this adds nothing to what is exposed - there is no route to
    # secure, nothing for a scanner to find, and no second credential to keep.
    ports:
      - "127.0.0.1:5093:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      # Read-only, and the snapshot rather than the database: nothing here can
      # write analytics data or reach the original.
      - goatcounter-snapshot:/snapshot:ro

    environment:
      # Reached through an ssh tunnel, so the origin a browser sees is
      # localhost and the port is the one the tunnel was opened on. Grafana
      # builds its own absolute links from this and its listening port, which
      # is 3000 inside the container - so a tunnel opened as `-L 3000:` gives
      # links that work, and one opened on another port gives links that do
      # not. Hence the command written out above and in deploy/README.md.
      GF_SERVER_DOMAIN: localhost

      # Set on the host beside the counter's own credentials.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}"

      # Nobody reads this without logging in, nobody creates an account, and
      # nothing is published from it. The numbers are the site owner's.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_FEATURE_TOGGLES_ENABLE: ""
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"

      # This container has no egress, so both of these would fail anyway; off
      # so that they are not tried and not logged as failures every hour.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"

      # Installing at run time is what the image was built to avoid; saying so
      # here stops a future edit reintroducing it.
      GF_INSTALL_PLUGINS: ""

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256

  prometheus:
    <<: *hardening
    cgroup_parent: playground-prometheus.slice
    build:
      context: deploy/prometheus
      dockerfile: Dockerfile
    image: ghul-playground-prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Ninety days. At this series count that is a few gigabytes on a disk with
      # hundreds free; the retention is chosen for how far back a question can
      # reach rather than for space.
      - --storage.tsdb.retention.time=90d
      # Nothing outside reaches it, so it needs no interface of its own; this is
      # for Grafana's queries and for its own scrape.
      - --web.listen-address=0.0.0.0:9090

    volumes:
      - prometheus-data:/prometheus

    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 128

  node-exporter:
    <<: *hardening
    cgroup_parent: playground-node-exporter.slice
    image: prom/node-exporter:v1.12.1

    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      # The container filesystems are Docker's business and are covered by
      # cAdvisor; this is about the machine.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)

    pid: host

    volumes:
      - /:/host:ro,rslave

    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64

  # Deliberately without the Docker socket. The usual recipe mounts it, which
  # is root on this machine for anything that gets into this container, and it
  # is not needed: cgroups and Docker's own directory, both read-only, give the
  # per-container processor and memory numbers this is here for.
  cadvisor:
    <<: *hardening
    cgroup_parent: playground-cadvisor.slice
    image: gcr.io/cadvisor/cadvisor:v0.55.1

    command:
      # Not --docker_only. That flag reports only containers cAdvisor has
      # identified through Docker, and identifying them means talking to
      # Docker's API and to containerd's socket - both root on this machine for
      # anything that gets into this container, which is the trade this was set
      # up to avoid. With the flag and without the sockets it reports exactly
      # one series, the root cgroup, which is the machine and not a container.
      #
      # Reading the cgroups directly gives a series per container keyed by the
      # cgroup's path, which carries the container's id. See the relabelling in
      # deploy/prometheus/prometheus.yml for what becomes of it.
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,cpu_topology,resctrl

    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

    # cAdvisor reads cgroup files that are not world-readable.
    cap_add:
      - DAC_READ_SEARCH

    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128

# Analytics history. Nothing else on this host is stateful, and this is
# deliberately a named volume rather than a bind mount so that a stray
# `docker compose down -v` is the only way to lose it by accident.
volumes:
  # The compile service's cache of built session cells: tmpfs, since it is a
  # cache and a restart losing it costs a recompile, and a volume rather than
  # a per-container tmpfs so that the analyse service can read it. Room for
  # the 64 MB cache with headroom for writes in flight.
  cells:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=72m,mode=1777,noexec,nosuid"

  goatcounter-data:

  # Rebuilt from goatcounter-data every few minutes, so losing it costs one
  # interval. Named rather than a tmpfs only because Grafana should find a
  # snapshot already there when the host restarts.
  goatcounter-snapshot:

  # Dashboards are provisioned from this repository; what lives here is the
  # login, and Grafana's own bookkeeping.
  grafana-data:

  prometheus-data:
